name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: /home/runner/.gradle
      JAVA_OPTS: "-XX:MaxMetaspaceSize=512m -Xmx2g"
      ORG_GRADLE_PROJECT_org.gradle.daemon: "false"
      ORG_GRADLE_PROJECT_org.gradle.parallel: "false"
      ORG_GRADLE_PROJECT_org.gradle.workers.max: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          
          # Create gradle.properties to limit resources
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.workers.max=1" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" >> gradle.properties
          
          # Build with minimal resource usage
          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            -Dorg.gradle.daemon=false \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.workers.max=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
