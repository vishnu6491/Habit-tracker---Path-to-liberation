name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GRADLE_USER_HOME: /home/runner/.gradle
      JAVA_OPTS: "-Xmx1g -XX:+UseG1GC"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          # Set system-wide file limit
          sudo sysctl -w fs.file-max=524288
          
          # Write limits config
          echo "* soft nofile 65536" | sudo tee -a /etc/security/limits.conf
          echo "* hard nofile 65536" | sudo tee -a /etc/security/limits.conf

          chmod +x gradlew

          cat > gradle.properties << EOF
          org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.caching=false
          android.enableBuildCache=false
          android.useAndroidX=true
          EOF

          # Use prlimit to directly force file descriptor limit on gradlew process
          prlimit --nofile=65536:65536 ./gradlew assembleDebug --no-daemon --console=plain -S

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
